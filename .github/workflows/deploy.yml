name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    defaults:
      run:
        working-directory: school-website

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: school-website/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: true

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: school-website/dist

      - id: deployment
        uses: actions/deploy-pages@v4
